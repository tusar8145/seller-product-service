spring:
  datasource:
    master:
      jdbc-url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      username: ${DB_USER}
      password: ${DB_PASS}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 50
        minimum-idle: 10
        pool-name: MasterPool
    replica:
      jdbc-url: jdbc:postgresql://${READ_REPLICA_DB_HOST}:${READ_REPLICA_DB_PORT}/${READ_REPLICA_DB_NAME}
      username: ${READ_REPLICA_DB_USER}
      password: ${READ_REPLICA_DB_PASS}
      driver-class-name: org.postgresql.Driver
      hikari:
        maximum-pool-size: 80
        minimum-idle: 10
        pool-name: ReplicaPool
        read-only: true
  jpa:
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      lettuce:
        pool:
          max-active: 100
          max-idle: 20
  kafka:
    bootstrap-servers: ${KAFKA_URI}
    consumer:
      group-id: ${KAFKA_GROUP_ID}
logging:
  level:
    root: WARN
    com.enterprise.product: INFO
